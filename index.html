<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#2c2c2a">
<title>2026 호남권 SW 창업아이디어 경진대회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css">
<style>
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5}
.bar .t{font-size:15px;font-weight:700;letter-spacing:-.02em}
.bar .sp{flex:1}
.myteam{font-size:14px;font-weight:700;background:rgba(253,242,220,.14);color:var(--fill);padding:7px 16px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--no);display:inline-block;flex:none}
.dot.live{background:var(--yellow)}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:26px 18px 34px;display:flex;flex-direction:column}

.h{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.34;margin-bottom:8px}
.sub{font-size:15px;color:var(--ink2);font-weight:500;line-height:1.55}

/* 가운데 안내 화면 */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:36px 10px}
.center .big{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.pulse{width:56px;height:56px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--yellow);animation:sp 1s linear infinite;margin-bottom:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.mk{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:700;
  background:rgba(232,112,95,.16);color:var(--no);margin-bottom:6px}
.btn{margin-top:10px;background:var(--fill);color:var(--fillInk);font-weight:800;font-size:17px;padding:16px 34px;border-radius:16px}
.btn:active{transform:scale(.97)}

/* 조 카드 */
.teamcard{background:var(--soft);border-radius:20px;padding:20px}
.teamcard .kick{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.teamcard .kick i{width:8px;height:8px;border-radius:50%;background:var(--field)}
.teamcard .no{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1.1;margin:0 0 14px}
.members{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.members li{background:var(--panel2);border-radius:14px;padding:11px 13px;display:flex;align-items:baseline;gap:8px}
.members .u{font-size:12px;font-weight:600;color:var(--ink3)}
.members .n{font-size:17px;font-weight:700;letter-spacing:-.02em}

/* 탭 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:18px 0 14px;background:var(--soft);padding:5px;border-radius:16px}
.tabs button{padding:13px;border-radius:12px;font-weight:700;font-size:16px;color:var(--ink3);transition:.15s}
.tabs button[aria-selected="true"]{background:var(--fill);color:var(--fillInk)}
.panel{background:var(--soft);border-radius:20px;padding:34px 20px;text-align:center}
.panel .big{font-size:20px;font-weight:700;margin-bottom:8px}

/* 조 선택 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.tcard{background:var(--soft);border:2px solid transparent;border-radius:20px;padding:16px 15px;text-align:left;transition:.15s;position:relative}
.tcard:active{transform:scale(.97);border-color:var(--yellow)}
.tcard .n{font-size:25px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.tcard .n i{width:8px;height:8px;border-radius:50%;background:var(--field)}
.tcard .f{font-size:11.5px;font-weight:700;margin-left:auto}
.tcard .a{font-size:12px;color:var(--ink3);font-weight:500;margin-top:7px;line-height:1.45}
.tcard.taken{opacity:.42;pointer-events:none}
.tcard.taken .f{color:var(--no)}
.tcard.mine{border-color:var(--yellow)}
.tcard.mine .f{color:var(--yellow)}

/* 확인 */
.confirm{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.confirm .q{font-size:19px;font-weight:700;text-align:center;margin-bottom:4px}
.btn.wide{width:100%;margin:0}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.link{display:block;margin:22px auto 0;color:var(--ink3);text-decoration:underline;font-size:13px;font-weight:600;padding:8px}

/* 퀴즈 — 부안 청년포럼 참여자 화면과 같은 구성: 문제 번호 + 큰 번호 키패드 */
/* 퀴즈 탭에서는 조 카드를 한 줄로 접어 키패드가 한 화면에 들어오게 한다 */
#app[data-tab="quiz"] .teamcard{padding:14px 20px}
#app[data-tab="quiz"] .teamcard .no{font-size:24px;margin:0}
#app[data-tab="quiz"] .teamcard .members{display:none}
#app[data-tab="quiz"] .tabs{margin-top:12px}
.tabs button{position:relative}
.tabs button.attn::after{content:'';position:absolute;top:9px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.quiz{display:flex;flex-direction:column;min-height:300px}
.quiz .center{padding:48px 10px}
.qwait .sub{font-size:16px}
.badges{display:flex;gap:7px;justify-content:center;margin-bottom:16px}
.badge{font-size:13px;font-weight:600;padding:8px 20px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.badge.num{background:var(--fill);color:var(--fillInk);font-weight:800}
/* 제출한 뒤 · 마감된 뒤 "기다려주세요" 안내 */
.waitbox{background:var(--soft);border-radius:20px;padding:26px 18px;text-align:center;margin-bottom:18px}
.waitbox.slim{padding:18px 16px}
.waitbox .pulse{width:34px;height:34px;border-width:3px;margin:0 auto 12px}
.waitbox.slim .pulse{width:26px;height:26px;margin-bottom:9px}
.waitbox .wt{font-size:18px;font-weight:800;color:var(--fill);letter-spacing:-.02em}
.waitbox.slim .wt{font-size:16px}
.waitbox .ws{font-size:14px;font-weight:600;color:var(--ink2);line-height:1.5;margin-top:7px}
/* 보기 번호 키패드 — 2열, 큼직하게 */
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.key{display:flex;align-items:center;justify-content:center;background:var(--soft);
  border:2px solid transparent;border-radius:22px;aspect-ratio:1.35;transition:.15s}
.key:active{transform:scale(.98)}
.key .n{font-weight:800;font-size:clamp(30px,10vw,48px);color:var(--ink2);letter-spacing:-.02em}
.key.sel{background:rgba(253,206,15,.16);border-color:var(--yellow)}
.key.sel .n{color:var(--fill)}
.keys .key:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:2.8}
.status{margin-bottom:18px;padding:16px 18px;border-radius:16px;font-size:15.5px;font-weight:600;text-align:center;background:var(--soft);color:var(--ink2)}
.status.err{background:rgba(232,112,95,.16);color:var(--no);font-weight:700}
.memtitle{font-size:22px;font-weight:800;text-align:center;margin-bottom:14px}
.memgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.memgrid span{background:var(--soft);border-radius:12px;padding:14px 2px;text-align:center;font-size:13.5px;font-weight:700;letter-spacing:-.04em}
.verdict{text-align:center;padding:30px 16px 26px}
.verdict .mk{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:52px;font-weight:700;background:var(--soft);color:var(--ink3)}
.verdict.ok .mk{background:var(--fill);color:var(--fillInk)}
.verdict.no .mk{background:rgba(232,112,95,.16);color:var(--no)}
.verdict .lb{font-size:21px;font-weight:700;margin-top:16px}
.verdict .an{font-size:16px;color:var(--ink2);font-weight:600;margin-top:10px}
.scorebar{display:flex;gap:12px;margin-top:6px}
.sb{flex:1;background:var(--soft);border-radius:18px;padding:16px;text-align:center}
.sb .k{font-size:12px;color:var(--ink3);font-weight:600}
.sb .v{font-size:29px;font-weight:700;color:var(--fill);letter-spacing:-.03em;margin-top:3px}
.medal{font-size:66px;line-height:1}
.rankbig{font-size:62px;font-weight:700;color:var(--fill);letter-spacing:-.045em;line-height:1}
.quiz .center .big{font-size:18px;color:var(--ink2)}

/* 진행 제출 */
.spinner{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:7px;border:2.5px solid var(--line);border-top-color:var(--yellow);border-radius:50%;animation:sp .8s linear infinite}
.qwarn{background:rgba(253,206,15,.14);color:var(--yellow);border-radius:14px;padding:13px 15px;font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5}
.stages{display:flex;flex-direction:column;gap:10px}
.stg{background:var(--soft);border-radius:20px;overflow:hidden;border:2px solid transparent}
.stg.open{border-color:var(--line)}
.stg-head{display:flex;align-items:center;gap:12px;width:100%;padding:17px 16px;text-align:left}
.stg .sn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink3)}
.stg.done .sn{background:var(--fill);color:var(--fillInk)}
.stg .nm{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em}
.stg .stt{font-size:13px;font-weight:700;color:var(--ink3)}
.stg .stt.done{color:var(--yellow)}
.stg .stt.wait{color:var(--no)}
.stg .chev{color:var(--ink3);font-size:20px;transition:.15s}
.stg.open .chev{transform:rotate(90deg)}
.stg-body{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.pg-loading,.pg-note{font-size:14px;color:var(--ink2);font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.fl{font-size:14.5px;font-weight:700}
.fl small{font-weight:500;color:var(--ink3)}
.fh{font-size:13px;color:var(--ink3);font-weight:500}
.fld input,.fld textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--yellow)}
.fld input:disabled,.fld textarea:disabled{opacity:.6}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos:empty{display:none}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:rgba(44,44,42,.8);color:var(--fill);font-size:14px;font-weight:800}
.pickbtn{align-self:flex-start;background:var(--panel2);color:var(--ink);font-size:14.5px;font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer}
.pdfcur{font-size:14px;color:var(--ink2);word-break:break-all}
.pdfcur a{color:var(--fill)}
.pbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .2s}
.pg-msg{font-size:14.5px;font-weight:600;color:var(--ink2);line-height:1.5}
.pg-msg:empty{display:none}
.pg-msg.ok{color:var(--yellow);font-weight:700}
.pg-msg.warn{color:var(--yellow)}
.pg-msg.err{color:var(--no);font-weight:700}
.btn:disabled{opacity:.5}

.foot{padding:18px 18px 24px;text-align:center;font-size:12px;color:var(--ink3);font-weight:500}
</style>
</head>
<body>

<div class="bar">
  <span class="dot" id="dot"></span>
  <div class="t">2026 호남권 SW 창업아이디어 경진대회</div>
  <div class="sp"></div>
  <div class="myteam" id="mt" hidden></div>
</div>

<main id="app">
  <div class="center"><div class="pulse"></div><div class="sub">연결 중…</div></div>
</main>

<div class="foot">라인교육연구소 &nbsp;·&nbsp; 의미있고 재미있게</div>


<script type="module">
import { TEAMS, TEAM_NOS, FIELD_COLORS, splitMember } from './js/data.js';
import { onConnection } from './js/db.js';
import { mountQuiz, watchQuizReset, clearQuizLocal } from './js/quiz/team.js';
import { mountProgress } from './js/progress-view.js';
import { loadSession, saveSession, clearSession, claimTeam, releaseTeam, watchClaims } from './js/auth.js';

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

onConnection(ok => $('#dot').classList.toggle('live', ok));
watchQuizReset();

// view: 'select' | 'confirm' | 'loading' | 'taken' | 'released' | 'error' | 'main'
let view = 'loading', teamNo = null, claims = {};

const membersHTML = n => `<ul class="members">${TEAMS[n].members.map(m => {
  const { univ, name } = splitMember(m);
  return `<li><span class="u">${esc(univ)}</span><span class="n">${esc(name)}</span></li>`;
}).join('')}</ul>`;

const teamCard = n => `<section class="teamcard" style="--field:${FIELD_COLORS[TEAMS[n].field]}">
  <div class="no">${n}조</div>${membersHTML(n)}</section>`;

const views = {
  loading: () => `<div class="center"><div class="pulse"></div><div class="sub">연결 중…</div></div>`,

  select: () => `
    <div class="h">우리 조를 골라주세요</div>
    <div class="sub">조별로 대표자 폰 한 대만 들어올 수 있어요.</div>
    <div class="grid">${TEAM_NOS.map(n => {
      const t = TEAMS[n], st = claims[n] || 'free';
      return `<button class="tcard ${st === 'other' ? 'taken' : st === 'mine' ? 'mine' : ''}" data-team="${n}"
        style="--field:${FIELD_COLORS[t.field]}" ${st === 'other' ? 'disabled' : ''}>
        <div class="n"><i></i>${n}조<span class="f">${st === 'other' ? '사용 중' : st === 'mine' ? '이 폰' : ''}</span></div>
        <div class="a">${esc(t.members.map(m => splitMember(m).name).join(' · '))}</div>
      </button>`;
    }).join('')}</div>`,

  confirm: () => `${teamCard(teamNo)}
    <div class="confirm">
      <div class="q">이 다섯 명이 우리 조가 맞나요?</div>
      <button class="btn wide" data-act="claim">네, ${teamNo}조로 들어갈게요</button>
      <button class="btn wide ghost" data-act="select">다시 고를게요</button>
    </div>`,

  taken: () => `<div class="center">
    <div class="mk">!</div>
    <div class="big">${teamNo}조는 이미 다른 폰에서<br>사용하고 있어요</div>
    <div class="sub">조별로 대표자 폰 한 대만 들어올 수 있어요.<br>대표자 폰을 바꿔야 하면 운영진에게 말해주세요.</div>
    <button class="btn" data-act="select">조 다시 고르기</button></div>`,

  released: () => `<div class="center">
    <div class="big">이 폰의 ${teamNo}조 연결이<br>해제되었어요</div>
    <div class="sub">운영진이 대표자 폰을 바꿨거나 연결을 풀었어요.</div>
    <button class="btn" data-act="select">조 다시 고르기</button></div>`,

  error: () => `<div class="center">
    <div class="mk">!</div>
    <div class="big">연결하지 못했어요</div>
    <div class="sub">와이파이나 데이터가 켜져 있는지 확인해 주세요.</div>
    <button class="btn" data-act="claim">다시 시도</button></div>`,

  main: () => `${teamCard(teamNo)}
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="quiz">퀴즈</button>
      <button role="tab" aria-selected="false" data-tab="progress">진행 제출</button>
    </nav>
    <div class="quiz" data-panel="quiz"></div>
    <div data-panel="progress" hidden></div>
    <button class="link" data-act="change">조 변경</button>`
};

let unmountQuiz = null, unmountProgress = null;

function go(v) {
  unmountQuiz?.(); unmountQuiz = null;
  unmountProgress?.(); unmountProgress = null;
  view = v;
  const tab = app.querySelector('[data-tab][aria-selected="true"]')?.dataset.tab; // 다시 그려도 탭 유지
  delete app.dataset.tab;   // 확인 화면 등에서는 조 카드를 접지 않는다
  app.innerHTML = views[v]();
  if (v === 'main') selectTab(tab || 'quiz');
  if (v === 'main') {
    unmountQuiz = mountQuiz(app.querySelector('[data-panel="quiz"]'), teamNo,
      needs => app.querySelector('[data-tab="quiz"]')?.classList.toggle('attn', needs));
    unmountProgress = mountProgress(app.querySelector('[data-panel="progress"]'), teamNo);
  }
  $('#mt').hidden = v !== 'main';
  $('#mt').textContent = teamNo ? `${teamNo}조` : '';
}

function selectTab(name) {
  app.dataset.tab = name;
  for (const x of app.querySelectorAll('[data-tab]')) x.setAttribute('aria-selected', x.dataset.tab === name);
  for (const p of app.querySelectorAll('[data-panel]')) p.hidden = p.dataset.panel !== name;
}

// ── 동작 ─────────────────────────────────────
async function claim() {
  go('loading');
  let r;
  try { r = await claimTeam(teamNo); }
  catch (e) { console.error(e); return go('error'); }
  if (r === 'taken') return go('taken');
  clearQuizLocal();   // 새로 고른 조 — 전에 쓰던 퀴즈 기록은 버린다
  saveSession(teamNo);
  go('main');
}

async function change() {
  if (!confirm(`${teamNo}조에서 나갈까요?\n다른 폰이나 다른 조로 다시 들어갈 수 있게 풀려요.`)) return;
  go('loading'); // 해제 이벤트로 '연결 해제' 화면이 잠깐 뜨지 않도록
  try { await releaseTeam(teamNo); }
  catch (e) { console.error(e); go('main'); return alert('해제하지 못했어요. 네트워크를 확인해 주세요.'); }
  clearSession();
  teamNo = null;
  go('select');
}

app.addEventListener('click', e => {
  const card = e.target.closest('[data-team]');
  if (card) { teamNo = Number(card.dataset.team); return go('confirm'); }
  const tab = e.target.closest('[data-tab]');
  if (tab) return selectTab(tab.dataset.tab);
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'select') { teamNo = null; go('select'); }
  else if (act === 'claim') claim();
  else if (act === 'change') change();
});

// 조 사용 현황: 선택 화면을 갱신하고, 이 폰의 조가 풀리거나 넘어가면 메인을 닫는다
watchClaims(c => {
  claims = c;
  if (view === 'select') go('select');
  if (view === 'main' && claims[teamNo] !== 'mine') {
    clearSession();
    go(claims[teamNo] === 'other' ? 'taken' : 'released');
  }
});

// ── 시작 ─────────────────────────────────────
const session = loadSession();
if (session && TEAMS[session.teamNo]) {
  // 이미 고른 폰은 바로 메인 (오프라인에서도 열리게).
  // 운영자가 그새 풀었는지는 watchClaims가 확인한다 — 여기서 다시 claim하면 해제가 무효가 된다
  teamNo = session.teamNo;
  go('main');
} else {
  go('select');
}
</script>
</body>
</html>
