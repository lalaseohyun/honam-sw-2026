<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2c2c2a">
<title>진행 현황 · 2026 호남권 SW 창업아이디어 경진대회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css">
<style>
/* 프로젝터용 — 최소 글자 24px, 칸 클릭 없음 (사양서 §3, §5, §11) */
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:24px;cursor:default;user-select:none}

.bar{display:flex;align-items:center;gap:18px;padding:16px 32px;border-bottom:1px solid var(--line);flex:none}
.bar .t{font-size:24px;font-weight:700;letter-spacing:-.02em}
.bar .h{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-left:6px}
.bar .sp{flex:1}
.pill{font-size:24px;font-weight:700;background:rgba(253,242,220,.14);color:var(--fill);padding:8px 22px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--yellow)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--no);flex:none}
.dot.live{background:var(--yellow)}

/* 10조×단계 격자 — 제출된 칸만 누를 수 있다. 누르면 그 제출물 전체를 크게 띄운다 (행사 당일 요청) */
#board{flex:1;min-height:0;overflow:hidden;padding:18px 32px 12px;
  display:grid;grid-template-columns:96px repeat(var(--stages,6),minmax(0,1fr));
  grid-template-rows:auto repeat(10,minmax(min-content,1fr));gap:8px 10px}
.hd{display:flex;align-items:baseline;gap:10px;padding:0 6px 4px;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.hd .k{color:var(--ink3);font-weight:700}
.hd .c{margin-left:auto;font-size:24px;font-weight:700;color:var(--ink3)}
.hd .c b{color:var(--yellow)}
.tn{display:grid;place-items:center;background:var(--soft);border-radius:14px;font-size:30px;font-weight:800;letter-spacing:-.03em}
.cell{display:flex;align-items:center;gap:12px;background:var(--line2);border-radius:14px;padding:8px 12px;min-width:0;overflow:hidden;transition:background .4s}
.cell.empty{justify-content:center;color:var(--ink3);font-size:24px;font-weight:600}
.cell.done{background:var(--soft);cursor:pointer}
.cell.done:hover{box-shadow:inset 0 0 0 3px var(--line)}
.cell .th{flex:none;width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--panel2)}
.cell .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--fillInk);display:grid;place-items:center;font-size:20px;font-weight:900}
.cell .sum{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
/* 방금 들어온 칸 */
.cell.fresh{background:rgba(253,206,15,.2);box-shadow:inset 0 0 0 3px var(--yellow)}

.foot{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:6px 32px 16px;flex:none}
.foot .note{font-size:24px;color:var(--ink3);margin-right:auto}
.navlink{font-size:24px;font-weight:700;color:var(--ink3);text-decoration:none;padding:12px 18px;border-radius:16px}
.navlink:hover{background:var(--soft);color:var(--ink)}
/* 로그인 — 현황판은 교수진·운영진만 (행사 당일 요청) */
body:not(.authed) .auth-only{display:none !important}
body.authed .login-wrap{display:none}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(480px,100%);background:var(--soft);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:30px;font-weight:800;margin-bottom:6px}
.login p{font-size:24px;color:var(--ink2);line-height:1.4}
.login input{font:inherit;font-size:24px;padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.login button{font-size:24px;font-weight:800;padding:16px;border-radius:14px;background:var(--fill);color:var(--fillInk);margin-top:6px}
.login .msg{font-size:24px;color:var(--no);min-height:1em}

/* 제출물 크게 보기 */
.detail{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:4vh 5vw}
.detail[hidden]{display:none}
.dsheet{width:min(1400px,100%);max-height:100%;overflow:auto;background:var(--bg);border-radius:28px;padding:clamp(28px,3.4vw,56px);
  display:flex;flex-direction:column;gap:clamp(18px,2.4vh,30px);box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;user-select:text}
.dhead{display:flex;align-items:flex-start;gap:20px}
.dhead .who{flex:1}
.dhead .k{font-size:clamp(24px,1.6vw,30px);font-weight:700;color:var(--yellow)}
.dhead h2{font-size:clamp(40px,3.6vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1.25;margin-top:6px;word-break:keep-all}
.dclose{flex:none;width:64px;height:64px;border-radius:50%;background:var(--soft);font-size:28px;font-weight:800}
.dfield{background:var(--soft);border-radius:22px;padding:clamp(20px,2.4vh,30px) clamp(24px,2vw,36px)}
.dfield .fl{font-size:clamp(24px,1.5vw,28px);font-weight:800;color:var(--yellow);margin-bottom:10px}
.dfield .fx{font-size:clamp(30px,2.3vw,44px);line-height:1.6;font-weight:500;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.dshots{display:flex;gap:16px;flex-wrap:wrap}
.dshots img{max-height:46vh;max-width:100%;border-radius:16px}
.dfield a{color:var(--fill);font-size:clamp(28px,2vw,38px);font-weight:700}
.fsbtn{font-size:24px;font-weight:700;padding:12px 22px;border-radius:16px;background:rgba(253,242,220,.14);color:var(--fill)}
</style>
</head>
<body>

<div class="login-wrap">
  <form class="login" id="login">
    <h1>진행 현황판</h1>
    <p>교수진·운영진 전용이에요. 로그인해 주세요.</p>
    <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <div class="msg" id="login-msg"></div>
    <button id="login-btn">로그인</button>
  </form>
</div>

<div class="bar auth-only">
  <span class="dot" id="dot"></span>
  <div class="t">2026 호남권 SW 창업아이디어 경진대회</div>
  <div class="h">진행 현황</div>
  <div class="sp"></div>
  <div class="pill" id="total"></div>
</div>

<div id="board" class="auth-only" aria-live="polite"></div>
<!-- 제출물 크게 보기 — #board는 2초마다 다시 그려지므로 바깥에 둔다 -->
<div class="detail" id="detail" hidden></div>

<div class="foot auth-only">
  <span class="note">라인교육연구소 &nbsp;·&nbsp; 의미있고 재미있게</span>
  <a class="navlink" href="main.html">메인</a>
  <button id="logout" class="navlink">로그아웃</button>
  <button id="fs" class="fsbtn">⛶ 전체화면</button>
</div>

<script type="module">
import { db, ref, get, onValue, onConnection, loadAuth } from './js/db.js';
import { TEAMS } from './js/data.js';
import { TEAM_NOS, STAGES } from './js/data.js';
import { setupFullscreen, toggleFullscreen } from './js/stage.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let pub = null;            // /public — 현황판은 이것만 구독한다 (사양서 §5)
const seen = new Map();    // "팀/단계" → 마지막으로 본 submittedAt
const freshUntil = new Map();
const FRESH_MS = 15000;
let first = true;

function render() {
  if (!pub) return;
  const now = Date.now();
  const counts = STAGES.map(s => TEAM_NOS.filter(n => pub[n]?.[s.id]?.submittedAt).length);
  const total = counts.reduce((a, b) => a + b, 0);
  $('#total').innerHTML = `제출 <b>${total}</b> / ${TEAM_NOS.length * STAGES.length}`;

  let html = '<div></div>' + STAGES.map((s, i) =>
    `<div class="hd"><span class="k">${i + 1}</span>${esc(s.name)}<span class="c"><b>${counts[i]}</b>/${TEAM_NOS.length}</span></div>`).join('');

  for (const n of TEAM_NOS) {
    html += `<div class="tn">${n}조</div>`;
    for (const s of STAGES) {
      const v = pub[n]?.[s.id];
      const key = `${n}/${s.id}`;
      if (v?.submittedAt && seen.get(key) !== v.submittedAt) {
        // 처음 불러온 것은 "방금 들어온 것"으로 치지 않는다
        if (!first) freshUntil.set(key, now + FRESH_MS);
        seen.set(key, v.submittedAt);
      }
      if (!v?.submittedAt) { html += `<div class="cell empty">—</div>`; continue; }
      const fresh = (freshUntil.get(key) || 0) > now;
      const lead = v.thumb ? `<img class="th" src="${esc(v.thumb)}" alt="">` : `<span class="ck">✓</span>`;
      html += `<div class="cell done ${fresh ? 'fresh' : ''}" data-cell="${n}:${s.id}" role="button" tabindex="0">${lead}<span class="sum">${esc(v.summary)}</span></div>`;
    }
  }
  $('#board').innerHTML = html;
  first = false;

}

// 로그인해야 구독을 시작한다 — DB 규칙도 /public 전체 읽기는 로그인한 사람만 허용
function start() {
  onConnection(ok => $('#dot').classList.toggle('live', ok));
  onValue(ref(db, 'public'), s => { pub = s.val() || {}; render(); },
    e => { $('#board').innerHTML = `<div class="hd">현황을 불러오지 못했어요: ${esc(e.message)}</div>`; });
}

loadAuth().then(({ auth, onAuthStateChanged, signInWithEmailAndPassword, signOut }) => {
  let started = false;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    $('#login-msg').textContent = '';
    $('#login-btn').disabled = true;
    try { await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#password').value); }
    catch (err) {
      $('#login-msg').textContent = /invalid|wrong|user-not-found/i.test(err.code) ? '이메일 또는 비밀번호가 맞지 않아요' : `로그인 실패: ${err.code}`;
    }
    $('#login-btn').disabled = false;
  };
  $('#logout').onclick = () => confirm('로그아웃할까요?') && signOut(auth);
  onAuthStateChanged(auth, user => {
    document.body.classList.toggle('authed', !!user);
    if (user && !started) { started = true; start(); }
    if (!user && started) location.reload();
  });
});

// 방금 들어온 칸 강조를 시간이 지나면 끈다
setInterval(() => { if ([...freshUntil.values()].some(t => t > Date.now() - 2000)) render(); }, 2000);

// ── 칸을 누르면 그 제출물 전체를 크게 ──────────
// 현황판 구독은 /public(요약)만. 누른 칸 하나만 그때 /private에서 읽어 온다.
async function openDetail(n, sid) {
  const s = STAGES.find(x => x.id === sid);
  const box = $('#detail');
  box.hidden = false;
  box.innerHTML = `<div class="dsheet"><div class="dhead"><div class="who"><div class="k">${n}조 · ${esc(s.name)}</div>
    <h2>불러오는 중…</h2></div><button class="dclose" data-dclose aria-label="닫기">✕</button></div></div>`;
  let v = null;
  try { v = (await get(ref(db, `private/${n}/${sid}`))).val(); } catch (e) { console.error(e); }
  if (box.hidden) return;
  const members = TEAMS[n].members.map(m => m.split(' ')[1]).join(' · ');
  const title = pub[n]?.[sid]?.summary || '';
  const fields = v ? s.fields.map(f => v.fields?.[f.key] ? `
    <div class="dfield"><div class="fl">${esc(f.label)}</div><div class="fx">${esc(v.fields[f.key])}</div></div>` : '').join('') : '';
  const photos = v?.photos?.length ? `<div class="dfield"><div class="fl">사진</div><div class="dshots">${v.photos.map(p => `<img src="${esc(p)}" alt="">`).join('')}</div></div>` : '';
  const pdf = v?.pdfUrl ? `<div class="dfield"><div class="fl">발표자료</div><a href="${esc(v.pdfUrl)}" target="_blank" rel="noopener">📄 ${esc(v.pdfName)}</a></div>` : '';
  box.innerHTML = `<div class="dsheet" role="dialog" aria-label="${n}조 ${esc(s.name)}">
    <div class="dhead"><div class="who"><div class="k">${n}조 · ${esc(s.name)} · ${esc(members)}</div><h2>${esc(title)}</h2></div>
      <button class="dclose" data-dclose aria-label="닫기">✕</button></div>
    ${v ? fields + photos + pdf : '<div class="dfield"><div class="fx">내용을 불러오지 못했어요.</div></div>'}
  </div>`;
}
const closeDetail = () => { const b = $('#detail'); b.hidden = true; b.innerHTML = ''; };

$('#board').addEventListener('click', e => {
  const c = e.target.closest('[data-cell]');
  if (c) { const [n, sid] = c.dataset.cell.split(':'); openDetail(Number(n), sid); }
});
$('#detail').addEventListener('click', e => {
  if (e.target.id === 'detail' || e.target.closest('[data-dclose]')) closeDetail();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#detail').hidden) closeDetail(); });

setupFullscreen($('#fs'));
$('#board').style.setProperty('--stages', STAGES.length);
document.addEventListener('keydown', e => { if (!e.target.closest('input, textarea') && (e.key === 'f' || e.key === 'F')) toggleFullscreen(); });

// 무인 운영 — 화면 꺼짐 방지 (지원하는 브라우저에서만, 탭이 다시 보이면 다시 요청)
async function keepAwake() {
  try { if (document.visibilityState === 'visible') await navigator.wakeLock?.request('screen'); } catch {}
}
keepAwake();
document.addEventListener('visibilitychange', keepAwake);
</script>
</body>
</html>
