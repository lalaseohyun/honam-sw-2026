<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2c2c2a">
<title>퀴즈 진행 · 2026 호남권 SW 창업아이디어 경진대회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/tokens.css">
<style>
/* ───────────────────────────────────────
   퀴즈 진행자(빔프로젝터) 화면 — 부안 청년포럼 퀴즈(css/host.css, css/sessions/quiz.css)와 같은 구성.
   무대(#stage)에는 제목 줄 없이 문제만 크게, 아래에 조작 바 하나.
   글자 크기는 화면 폭(vw)에 맞춰 크게 잡고, 넘칠 때만 js/quiz/host.js fitQuestion()이
   --qs(문제 글자)·--cs(보기 칸)를 조금씩 낮춘다.
   ─────────────────────────────────────── */
:root{--beige:#ececec;--beigeInk:#3a3a38;--correct:#F6D049}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
body:not(.authed) .auth-only{display:none !important}
body.authed .login-wrap{display:none}

/* 연결 끊김 — 화면 어디서나 보이는 위치 */
#alert{position:fixed;top:18px;right:22px;z-index:30;display:none;
  background:var(--no);color:#2c2c2a;padding:10px 20px;border-radius:999px;font-size:15px;font-weight:800}
body.authed.offline #alert{display:block}

.body{flex:1;min-height:0;display:flex}
/* 위쪽 여백을 아래보다 넉넉하게 — 문제가 화면 맨 위에 붙어 보이지 않게 */
#stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(58px,9.2vh,146px) clamp(28px,4.5vw,90px) clamp(24px,3.6vh,54px)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.pulse{width:72px;height:72px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--yellow);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.big{font-size:40px;font-weight:700}
.note{font-size:24px;color:var(--ink2);font-weight:500}

/* ── 대기화면 (QR) ── */
.lobby{display:grid;grid-template-columns:auto auto;gap:clamp(40px,4.6vw,90px);
  align-items:center;justify-content:center;flex:1;min-height:0;padding:0 clamp(30px,4vw,70px)}
.qrside{display:flex;flex-direction:column;align-items:center;gap:14px}
.qrbox{background:#fff;border-radius:24px;padding:clamp(18px,1.8vw,28px);line-height:0}
.qrbox img,.qrbox canvas{width:clamp(300px,28vw,620px)!important;height:auto!important;display:block}
.qrbox .noqr{width:clamp(300px,28vw,620px);color:#2c2c2a;font-size:24px;font-weight:700;line-height:1.5;padding:20px;text-align:center;word-break:break-all}
.qrwarn{max-width:clamp(300px,28vw,620px);font-size:24px;line-height:1.45;color:var(--no);font-weight:700;text-align:center}
.lobby h2{font-size:clamp(40px,4.6vw,110px);font-weight:800;letter-spacing:-.04em;line-height:1.22;margin-bottom:clamp(14px,2.2vh,30px)}
.lobby h2 span{color:var(--yellow)}
.lsub{font-size:clamp(24px,2.4vw,52px);color:var(--ink2);font-weight:600;margin-bottom:clamp(8px,1.2vh,16px)}
.lsub b{color:var(--yellow)}
.lobby .chips{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;max-width:none;
  gap:clamp(10px,1vw,16px);margin:clamp(14px,2.2vh,28px) 0 0}
.lobby .chip{width:clamp(64px,5.6vw,104px);font-size:clamp(28px,2.4vw,44px)}

/* ── 문제 — 문제만/+보기/+제출현황/정답 4페이지 ──
   세로 가운데 정렬 금지 — 페이지를 넘길 때 문제가 위아래로 움직이면 시선이 흐트러진다.
   항상 위에 붙이고, 아직 안 보일 것도 자리는 잡아둔다(visibility:hidden). */
.qview{flex:1;min-height:0;display:flex;flex-direction:column;--qs:1;--cs:1}
.badges{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:clamp(8px,1.2vh,16px);flex:0 0 auto}
.badge{font-size:clamp(18px,1.3vw,26px);font-weight:600;padding:8px 22px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.badge.num{background:var(--fill);color:var(--fillInk);font-weight:800}

.q{font-size:calc(clamp(42px,5.4vw,104px) * var(--qs,1));font-weight:800;line-height:1.3;letter-spacing:-.038em;
  text-align:center;margin-bottom:clamp(16px,2.2vh,32px);flex:0 0 auto;word-break:keep-all}

/* 보기 — 짧은 보기는 가로 한 줄에 전부(--n열), 번호 원 위·글자 아래 */
.choices{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:clamp(18px,2.3vw,44px);flex:0 0 auto}
.ch{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(clamp(6px,1vh,12px) * var(--cs,1));
  background:var(--soft);border:2px solid transparent;border-radius:22px;
  padding:calc(clamp(14px,2.2vh,32px) * var(--cs,1)) clamp(14px,1.4vw,26px);text-align:center;transition:.25s}
.ch .n{flex:none;width:calc(clamp(58px,4.7vw,90px) * var(--cs,1));height:calc(clamp(58px,4.7vw,90px) * var(--cs,1));
  border-radius:50%;background:var(--panel2);
  display:grid;place-items:center;font-weight:800;font-size:calc(clamp(27px,2.4vw,44px) * var(--cs,1));color:var(--ink2)}
.ch .t{font-size:calc(clamp(31px,3.6vw,68px) * var(--cs,1));font-weight:700;letter-spacing:-.028em;line-height:1.24;word-break:keep-all}
.ch .t .sub{font-size:max(24px,.62em);font-weight:700;color:var(--correct);line-height:1.35;display:inline-block;margin-top:.2em}
.ch .tally{font-size:calc(clamp(24px,2.2vw,40px) * var(--cs,1));font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 긴 보기(문장·순서 나열) — 2열, 번호 왼쪽·글자 오른쪽 */
.choices.long{gap:clamp(12px,1.4vw,26px) clamp(16px,1.8vw,34px)}
.choices.long .ch{flex-direction:row;justify-content:flex-start;text-align:left;
  gap:calc(clamp(12px,1.2vw,22px) * var(--cs,1));padding:calc(clamp(12px,1.8vh,26px) * var(--cs,1)) clamp(18px,1.6vw,30px)}
.choices.long .ch .t{flex:1;font-size:calc(clamp(26px,2.3vw,46px) * var(--cs,1))}
.choices.long .ch:last-child:nth-child(odd){grid-column:1/-1}
/* 한 줄에 하나씩(q2 다섯 줄) — 줄 높이를 번호 원이 아니라 글자가 정하도록 원·여백을 줄인다 */
/* 다섯 줄 문항은 세로가 빠듯하다 — 위 여백과 아래 제출현황·조 원을 줄여 보기 칸에 자리를 준다 */
#stage:has(.choices.rows){padding-top:clamp(28px,4vh,56px)}
.qview:has(.choices.rows) .tstat{font-size:calc(clamp(28px,2.4vw,44px) * var(--cs,1))}
.qview:has(.choices.rows) .chip{width:calc(clamp(52px,4.2vw,76px) * var(--cs,1));font-size:calc(clamp(24px,2vw,36px) * var(--cs,1))}
.qview:has(.choices.rows) .foot{padding-top:clamp(8px,1vh,14px)}
/* 칸 높이·간격은 고정 — 넘칠 때 글자만 줄고 칸은 넉넉하게 남는다 */
.choices.rows{gap:clamp(16px,2.2vh,28px);max-width:1500px;width:100%;margin:0 auto}
.choices.rows .ch{padding:clamp(18px,2.6vh,30px) clamp(22px,2vw,38px)}
/* 정답 페이지는 해설 박스가 자리를 나눠 쓰므로 칸 여백만 조금 줄인다 */
.qview.revealed .choices.rows{gap:clamp(10px,1.4vh,18px)}
.qview.revealed .choices.rows .ch{padding:clamp(10px,1.5vh,18px) clamp(22px,2vw,38px)}
.choices.rows .ch .n{width:calc(clamp(40px,3vw,58px) * var(--cs,1));height:calc(clamp(40px,3vw,58px) * var(--cs,1));font-size:calc(clamp(22px,1.7vw,32px) * var(--cs,1))}
.choices.rows .ch .t{font-size:calc(clamp(28px,2.5vw,48px) * var(--cs,1))}
.qview.revealed .choices.rows .ch .n{width:calc(clamp(36px,2.6vw,50px) * var(--cs,1));height:calc(clamp(36px,2.6vw,50px) * var(--cs,1));font-size:calc(clamp(20px,1.5vw,28px) * var(--cs,1))}
.qview.revealed .choices.rows .ch .t{font-size:calc(clamp(26px,2.1vw,40px) * var(--cs,1))}

/* 정답 공개 — 구성은 그대로, 정답 보기만 노랗게 */
.ch.correct{background:var(--correct);border-color:var(--correct)}
.ch.correct .n{background:var(--fillInk);color:var(--fill)}
.ch.correct .t,.ch.correct .tally{color:var(--fillInk)}
.ch.correct .t .sub{color:var(--fillInk);opacity:.72}
.ch.dimmed{opacity:.4}
/* 정답 공개 뒤에는 보기의 부연(노란 작은 글)을 접고 앞부분(A팀·B팀…)만 남긴다 —
   같은 내용이 해설 박스에 다시 나오고, 그만큼 해설 글자를 크게 둘 수 있다 */
.qview.revealed .ch .t .sub,.qview.revealed .ch .t br{display:none}

/* 해설 — 보기 바로 아래 연회색 박스, 문장마다 줄바꿈, 가운데 정렬 */
.answerbox{background:var(--beige);color:var(--beigeInk);border-radius:24px;
  margin-top:clamp(14px,2.2vh,32px);padding:clamp(14px,2vh,28px) clamp(39px,4.68vw,86px);
  font-size:clamp(26px,2.5vw,44px);line-height:1.45;font-weight:500;letter-spacing:-.02em;
  text-align:center;flex:1 1 auto;min-height:0;overflow:hidden;word-break:keep-all;
  display:flex;flex-direction:column;justify-content:center}
.answerbox p+p{margin-top:clamp(3px,.6vh,9px)}
.egrid{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:clamp(8px,1.2vw,24px)}
.egrid div{display:flex;flex-direction:column;align-items:center;gap:.15em}
.egrid b{font-weight:800}
.egrid span{font-weight:600;color:rgba(58,58,56,.7);font-variant-numeric:tabular-nums}

/* 화면 맨 아래 묶음 — 제출현황 + 페이지 점. 항상 맨 아래에 붙어서 문제·보기를 안 민다 */
.qbottom{margin-top:auto;flex:0 0 auto}
.qview.revealed .qbottom{margin-top:0}
/* 정답 페이지 — 이미 읽은 문제·보기를 한 단계 줄여 해설 자리를 만든다 */
.qview.revealed .q{font-size:calc(clamp(38px,4.3vw,80px) * var(--qs,1));margin-bottom:clamp(12px,1.8vh,26px)}
.qview.revealed .ch{padding:calc(clamp(10px,1.4vh,20px) * var(--cs,1)) clamp(20px,2vw,36px);
  gap:calc(clamp(5px,.8vh,11px) * var(--cs,1));border-radius:18px}
.qview.revealed .choices.long .ch{gap:calc(clamp(10px,1vw,18px) * var(--cs,1))}
.qview.revealed .ch .n{width:calc(clamp(50px,3.8vw,70px) * var(--cs,1));height:calc(clamp(50px,3.8vw,70px) * var(--cs,1));
  font-size:calc(clamp(25px,2.1vw,37px) * var(--cs,1))}
.qview.revealed .ch .t{font-size:calc(clamp(24px,2.7vw,48px) * var(--cs,1))}
.qview.revealed .choices.long .ch .t{font-size:calc(clamp(24px,1.9vw,38px) * var(--cs,1))}
.qview.revealed .ch .tally{font-size:calc(clamp(24px,1.9vw,34px) * var(--cs,1))}
.qview.revealed .foot{padding-top:calc(clamp(8px,1.1vh,18px) * var(--cs,1))}
.qview.revealed .foot .tstat{font-size:calc(clamp(24px,2.2vw,36px) * var(--cs,1))}
.qview.revealed .foot .chip{width:calc(clamp(58px,5vw,96px) * var(--cs,1));font-size:calc(clamp(26px,2.3vw,42px) * var(--cs,1))}

.foot{padding-top:calc(clamp(12px,1.6vh,28px) * var(--cs,1));flex:0 0 auto}
.tmeta{display:flex;justify-content:center}
.tstat{font-size:calc(clamp(34px,3.6vw,68px) * var(--cs,1));font-weight:700;color:var(--ink2)}
.tstat b{color:var(--yellow)}
.tstat.done{color:var(--yellow)}

/* 조 원 — 10개 조가 한 줄에 */
.chips{display:flex;flex-wrap:wrap;justify-content:center;
  gap:calc(clamp(8px,1.2vh,18px) * var(--cs,1)) clamp(10px,1.2vw,22px);
  margin:calc(clamp(8px,1vh,14px) * var(--cs,1)) auto 0;flex:0 0 auto}
.chip{width:calc(clamp(64px,6vw,112px) * var(--cs,1));flex:0 0 auto;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  background:var(--soft);color:var(--ink3);
  font-weight:800;font-size:calc(clamp(28px,2.8vw,50px) * var(--cs,1));letter-spacing:-.02em;transition:.2s}
.chip.on{background:var(--yellow);color:#2c2c2a}
.chip.done{background:var(--fill);color:var(--fillInk)}
.chip.wrong{background:var(--panel2);color:var(--no);box-shadow:inset 0 0 0 3px var(--no)}
.chip .mk{position:absolute;top:2%;right:2%;width:32%;height:32%;
  border-radius:50%;display:grid;place-items:center;font-size:.55em;font-weight:800;
  background:var(--yellow);color:#2c2c2a;border:3px solid var(--bg)}
.chip .mk.x{background:var(--no)}
.chip .mk.none{background:var(--panel2);color:var(--ink3)}

/* 남은 페이지 — 노란 점, 지금 페이지가 크고 밝다 */
.pagedots{display:flex;gap:clamp(8px,.8vw,14px);justify-content:center;align-items:center;
  padding-top:clamp(12px,1.8vh,26px);flex:0 0 auto}
.pagedots i{width:clamp(9px,.75vw,14px);height:clamp(9px,.75vw,14px);border-radius:50%;
  background:rgba(253,206,15,.22);display:block;transition:.2s}
.pagedots i.on{background:var(--yellow);transform:scale(1.35)}

/* 기억 격자 (q3) */
.memgrid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(10px,1.2vw,20px);align-content:center}
.memgrid span{background:var(--soft);border-radius:20px;padding:clamp(18px,3vh,40px) 8px;text-align:center;
  font-size:clamp(32px,3vw,58px);font-weight:800;letter-spacing:-.03em}

/* 최종 순위 */
.finaltitle{font-size:clamp(63px,7.6vw,140px);font-weight:800;line-height:1.3;letter-spacing:-.038em;
  text-align:center;color:var(--ink);margin-bottom:clamp(20px,3.4vh,48px);flex:0 0 auto}
.rank{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
  grid-template-rows:repeat(var(--rows,5),1fr);gap:clamp(8px,1.4vh,20px) clamp(39px,5.46vw,98px);overflow:hidden}
.row{display:flex;align-items:center;gap:clamp(24px,2.54vw,44px);padding:0 clamp(32px,3.32vw,59px);
  background:var(--soft);border-radius:18px;min-height:0}
.row .r{flex:0 0 auto;min-width:clamp(90px,7vw,140px);font-size:clamp(34px,3.4vw,62px);font-weight:800;color:var(--ink3);letter-spacing:-.03em}
.row .tm{font-size:clamp(38px,3.8vw,70px);font-weight:800;white-space:nowrap;flex:1}
.row .sc{font-size:clamp(52px,5.4vw,100px);font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
.row .sc small{font-size:.42em;color:var(--ink3);font-weight:600}
.row.p1{background:var(--fill)}
.row.p1 .r,.row.p1 .sc,.row.p1 .tm{color:var(--fillInk)}
.row.p2,.row.p3{background:var(--panel2)}
.row.p2 .r,.row.p3 .r{color:var(--fill)}

/* 실시간 순위 패널 (R) */
#rankpanel{width:360px;flex:none;background:var(--soft);padding:24px;overflow:auto;border-left:1px solid var(--line2)}
.rp-title{font-size:26px;font-weight:800;margin-bottom:14px}
.rp-title small{display:block;font-size:16px;color:var(--ink3);font-weight:500;margin-top:4px}
.ranks{list-style:none;display:flex;flex-direction:column;gap:8px}
.ranks li{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:var(--panel2);font-size:24px}
.ranks li.first{background:var(--fill);color:var(--fillInk)}
.ranks .rk{width:36px;text-align:center;font-weight:800}
.ranks .tn{flex:1;font-weight:800}
.ranks .rc{font-weight:800;color:var(--yellow)}
.ranks li.first .rc{color:var(--fillInk)}

/* ── 하단 조작 바 — 진행자용이라 작게 (부안과 같은 크기) ── */
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:12px 22px;border-top:1px solid var(--line2);background:#252523}
body.bar-hidden .ctl{display:none}
.ctl button{font-size:15px;font-weight:600;border-radius:11px;background:var(--soft);color:var(--ink);padding:12px 18px;white-space:nowrap;transition:.15s}
.ctl button:hover{background:var(--panel2)}
.ctl button:disabled{opacity:.35;cursor:not-allowed}
.ctl button.primary{background:var(--yellow);color:#2c2c2a;font-weight:800;font-size:17px;padding:13px 32px;min-width:170px}
.ctl button.primary:hover{background:#ffd93a}
.ctl button.primary.ready{animation:ready 1.3s ease-in-out infinite}
@keyframes ready{50%{opacity:.55}}
.ctl button.ghost{background:transparent;color:var(--ink2)}
.ctl button.danger{background:transparent;color:var(--no)}
.ctl button.on{background:var(--panel2);color:var(--yellow)}
.ctl .sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--soft);padding:8px 15px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--yellow);font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:var(--no);flex:none}
.dot.live{background:var(--yellow)}
.ctl .fsbtn{background:rgba(253,242,220,.14);color:var(--fill);font-weight:700}

/* 로그인 */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:min(480px,100%);background:var(--soft);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:30px;font-weight:800;margin-bottom:6px}
.login input{font:inherit;font-size:24px;padding:14px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.login button{font-size:24px;font-weight:800;padding:16px;border-radius:14px;background:var(--fill);color:var(--fillInk);margin-top:6px}
.login .msg{font-size:24px;color:var(--no);min-height:1em}
</style>
</head>
<body>

<div id="alert">연결 끊김 · 재연결 중</div>

<div class="login-wrap">
  <form class="login" id="login">
    <h1>퀴즈 진행자 로그인</h1>
    <input id="email" type="email" autocomplete="username" value="admin@laain.kr" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <div class="msg" id="login-msg"></div>
    <button id="login-btn">로그인</button>
  </form>
</div>

<div class="body auth-only">
